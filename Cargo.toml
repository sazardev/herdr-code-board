[package]
name = "herdr-code-board"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"  # std::fs::File::try_lock
description = "Kanban queue for agentic prompts inside Herdr: cards dispatch real agents into panes, worktrees and workspaces."
license = "MIT"
repository = "https://github.com/sazardev/herdr-code-board"
readme = "README.md"
keywords = ["herdr", "kanban", "agents", "tui", "workflow"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ulid = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
